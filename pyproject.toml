[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "agentchat"
version = "0.1.0a2"
description = "Connect chat platforms to Python agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BerriAI" }]
dependencies = [
    "slack-sdk>=3.41,<4",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.4,<1"]
discord = ["discord.py>=2.6,<3"]
teams = [
    "microsoft-agents-hosting-aiohttp>=1.9,<2",
    "microsoft-agents-authentication-msal>=1.9,<2",
]
imessage = ["python-socketio[asyncio-client]>=5.13,<6"]
whatsapp = []  # Uses the existing aiohttp dependency.
ycloud = []  # Uses the existing aiohttp dependency.
telegram = []
dev = [
    "openai-agents>=0.4,<1",
    "discord.py>=2.6,<3",
    "microsoft-agents-hosting-aiohttp>=1.9,<2",
    "microsoft-agents-authentication-msal>=1.9,<2",
    "python-socketio[asyncio-client]>=5.13,<6",
    "pytest>=7.3,<9",
    "pytest-asyncio>=0.21,<1",
    "ruff>=0.14,<1",
    "mypy>=2.4,<3",
]

[tool.maturin]
manifest-path = "src/bindings/python/Cargo.toml"
python-source = "python"
module-name = "agentchat._native"
features = ["pyo3/extension-module"]
include = ["docs/**/*.md", "examples/**/*.py", "tests/**/*.py", "conformance/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
src = ["python"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agentchat", "tests"]

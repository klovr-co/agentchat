[package]
name = "agentchat-node"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "agentchat_node"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
agentchat-core = { path = "../../agentchat-core" }
agentchat-slack = { path = "../../agentchat-slack" }
napi = { version = "3", features = ["napi8", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }

[build-dependencies]
napi-build = "2"

[workspace]
resolver = "2"
members = [
    "src/agentchat",
    "src/agentchat-core",
    "src/agentchat-slack",
    "src/agentchat-providers",
    "src/bindings/python",
    "src/bindings/node",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BerriAI/agentchat"

[workspace.dependencies]
agentchat-core = { version = "=0.1.0-alpha.2", path = "src/agentchat-core" }
agentchat-slack = { version = "=0.1.0-alpha.2", path = "src/agentchat-slack" }
agentchat-providers = { version = "=0.1.0-alpha.2", path = "src/agentchat-providers" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
